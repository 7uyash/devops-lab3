input {
  beats { port => 5044 }
}

filter {
  # 1) access log line:
  #    2026-11-18T10:15:01.123 INFO shoplite 172.18.0.1 GET /api/products 200 12.4ms user=u7 instance=shoplite-1
  # 2) application error line:
  #    2026-11-18T10:15:02.456 ERROR shoplite payment gateway timeout while processing order user=u7
  grok {
    match => {
      "message" => [
        "%{TIMESTAMP_ISO8601:log_time} %{LOGLEVEL:level} %{WORD:logger} %{IP:client_ip} %{WORD:method} %{URIPATH:path}(?:%{URIPARAM:query})? %{NUMBER:status:int} %{NUMBER:duration_ms:float}ms user=%{NOTSPACE:user} instance=%{NOTSPACE:instance}",
        "%{TIMESTAMP_ISO8601:log_time} %{LOGLEVEL:level} %{WORD:logger} %{GREEDYDATA:error_message} user=%{NOTSPACE:user}"
      ]
    }
    tag_on_failure => ["_grok_failed"]
  }

  date {
    match  => ["log_time", "yyyy-MM-dd'T'HH:mm:ss.SSS"]
    target => "@timestamp"
    timezone => "UTC"
  }

  if [status] {
    if [status] >= 500      { mutate { add_field => { "status_class" => "5xx" } } }
    else if [status] >= 400 { mutate { add_field => { "status_class" => "4xx" } } }
    else                    { mutate { add_field => { "status_class" => "2xx" } } }
    mutate { add_field => { "log_type" => "access" } }
  } else {
    mutate { add_field => { "log_type" => "application" } }
  }

  if [duration_ms] and [duration_ms] > 300 { mutate { add_tag => ["slow_request"] } }

  mutate { remove_field => ["log_time", "agent", "ecs", "input", "host"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "shoplite-logs-%{+YYYY.MM.dd}"
  }
}
