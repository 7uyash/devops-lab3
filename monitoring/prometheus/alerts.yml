groups:
  - name: shoplite
    rules:
      - alert: InstanceDown
        expr: up{job="shoplite"} == 0
        for: 15s
        labels: { severity: critical }
        annotations:
          summary: "ShopLite instance {{ $labels.instance }} is down"

      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[1m])) / sum(rate(http_requests_total[1m])) > 0.05
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of requests are failing"

      - alert: SlowResponses
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 0.5
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "p95 latency is above 500 ms"
