global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    lab: devops-lab3

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: shoplite
    metrics_path: /metrics
    static_configs:
      - targets: ["app1:8000", "app2:8000"]
        labels: { service: shoplite }

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
